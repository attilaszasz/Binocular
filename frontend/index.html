<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binocular</title>
    <!-- FOUC prevention: set dark class before first paint.
         Logic mirrors resolveTheme() in src/theme/resolveTheme.ts. -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('binocular-theme');
          if (theme === 'dark') {
            document.documentElement.className = 'dark';
          } else if (theme === 'light') {
            document.documentElement.className = '';
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.className = 'dark';
          }
        } catch (e) {
          // localStorage unavailable — leave class unset (light default)
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
