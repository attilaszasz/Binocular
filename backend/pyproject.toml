[project]
name = "binocular"
version = "0.1.0"
description = "Self-hosted firmware-update watcher for offline devices"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.32",
]

[project.scripts]
binocular = "binocular.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binocular"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["binocular"]
plugins = ["pydantic.mypy"]
exclude = ["tests/extensions/fixtures"]

[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 88
extend-exclude = ["tests/extensions/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104"]

[tool.coverage.run]
source = ["binocular"]

[tool.coverage.report]
fail_under = 80

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.8",
    "pip-audit>=2.7",
]
