services:
  binocular:
    build: .
    image: binocular:local
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - binocular-data:/app/data
      - binocular-modules:/app/modules
    environment:
      BINOCULAR_AUTH_ENABLED: "false"

volumes:
  binocular-data:
  binocular-modules: