services:
  binocular:
    build: .
    image: binocular:local
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - binocular-data:/app/data
      - binocular-modules:/app/modules
    environment:
      BINOCULAR_AUTH_ENABLED: "false"
      # PUID=1000   # uncomment to set container user ID (run `id -u`)
      # PGID=1000   # uncomment to set container group ID (run `id -g`)

volumes:
  binocular-data:
  binocular-modules: