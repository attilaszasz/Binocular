services:
  binocular:
    build: .
    image: binocular:local
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - binocular-data:/app/data
      - binocular-modules:/app/modules
    secrets:
      - binocular_auth_password
    environment:
      BINOCULAR_AUTH_PASSWORD_FILE: /run/secrets/binocular_auth_password
      # Backup configuration (optional — defaults shown)
      # BINOCULAR_BACKUP_SCHEDULE_HOURS: "24"    # 0 = disabled
      # BINOCULAR_BACKUP_RETENTION_COUNT: "7"    # 0 = unlimited

secrets:
  binocular_auth_password:
    file: ./secrets/auth_password

volumes:
  binocular-data:
  binocular-modules: